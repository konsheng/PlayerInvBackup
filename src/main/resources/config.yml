# PlayerInvBackup 配置 (Paper / Folia 1.21.1+)
# 备份范围: 仅玩家背包 (含盔甲/副手) + 末影箱

# 语言文件 (位于 plugins/PlayerInvBackup/lang/)
# 可通文件 "zh_CH.yml, en_US.yml"
# 修改后可使用 /pib reload 重载生效
language: "zh_CN.yml"

display:
  # 备份时间显示格式 (Java DateTimeFormatter pattern)
  # 示例: "yyyy-MM-dd HH:mm:ss"
  backup-time-format: "yyyy-MM-dd HH:mm:ss"

backup:
  # 自动备份间隔 (分钟, 0 = 关闭自动备份)
  interval-minutes: 30

  # 错峰秒数: 每个玩家每轮备份会加上随机延迟, 避免 200 人同一刻写入造成 I/O 峰值
  jitter-seconds: 300

  # 每玩家保留最近 N 份备份 (0 = 不清理, 建议大服不要设置为 0)
  keep-per-player: 50

  # 每玩家保留最近 N 天备份 (0 = 不清理)
  # 与 keep-per-player 可同时使用
  keep-days: 0

  # 事件触发器: 启用后, 会在对应事件发生时自动备份一次
  triggers:
    # 加入游戏
    join: true
    # 离开游戏
    quit: true
    # 死亡
    death: true
    # 切换世界
    world-change: true

  # 自动备份排除世界 (定时/事件触发都会跳过)
  # 玩家在这些世界内时不会进行任何备份操作
  excluded-worlds: []

audit:
  # 是否启用操作审计
  # 启用后会把关键操作写入 logs 文件夹内
  # 日志自动按天切分, 旧文件会自动压缩为 .gz
  enabled: true

  # 是否在控制台输出每条审计记录
  console: true

  # 审计日志保留天数 (0 = 不清理)
  keep-days: 30

bstats:
  # bStats 统计
  enabled: true

storage:
  # 存储后端: local | sqlite | mysql | postgresql | h2
  type: sqlite

  local:
    # 相对 plugins/PlayerInvBackup/ 的路径
    base-path: "data"

  sqlite:
    # 相对 plugins/PlayerInvBackup/ 的路径
    file: "data/backups.db"

  mysql:
    # 如果填写 url, 会优先使用 url
    url: ""
    host: "127.0.0.1"
    port: 3306
    database: "playerinvbackup"
    username: "root"
    password: ""
    # 额外参数, 以 & 连接. 例如: useSSL=false&serverTimezone=UTC
    parameters: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8"

  postgresql:
    # 如果填写 url, 会优先使用 url
    url: ""
    host: "127.0.0.1"
    port: 5432
    database: "playerinvbackup"
    username: "postgres"
    password: ""
    # 额外参数, 以 & 连接. 例如: sslmode=disable
    parameters: "sslmode=disable"

  h2:
    # 如果填写 url, 会优先使用 url
    url: ""
    # 相对 plugins/PlayerInvBackup/ 的路径, 不需要写 .mv.db 后缀
    file: "data/backups_h2"
    username: "sa"
    password: ""
    # 额外参数, 以 ; 连接. 例如: MODE=MySQL;DATABASE_TO_UPPER=false
    parameters: "MODE=MySQL;DATABASE_TO_UPPER=false"

performance:
  # I/O 队列上限: 达到上限后将跳过新的备份请求 (避免拖垮服务器线程)
  queue-limit: 500

  # 最大写入/秒 (软限制, 尽量控制写入速度)
  max-writes-per-second: 20

gui:
  # GUI 模式: auto | bukkit | packet
  # auto: 自动切换, 有 ProtocolLib 时使用 packet, 否则使用 bukkit
  # bukkit: 强制使用原生 Bukkit Inventory GUI
  # packet: 强制使用 Packet GUI, 需要 ProtocolLib, 否则自动降级
  mode: "auto"

  # 每页显示备份数量 (最大 45)
  list-page-size: 45

  backup-list:
    # 时间筛选列表, 按顺序循环
    # 支持:
    # - all
    # - 数字 + s/m/h/d, 例如 30m, 1h, 6h, 12h, 24h, 7d, 30d
    time-filters:
      - "all"
      - "30m"
      - "1h"
      - "6h"
      - "12h"
      - "24h"
      - "7d"
      - "30d"

sounds:
  gui:
    # 是否启用 GUI 音效功能
    enabled: true

    # 默认 GUI 点击音效
    # 下面未单独指定的按钮会继承这里
    click:
      # 设置为 "NONE" 表示关闭
      name: "UI_BUTTON_CLICK"
      volume: 1.0
      pitch: 1.0

    # 点击屏障槽位或不可操作提示槽位时播放
    barrier-slot:
      name: "BLOCK_NOTE_BLOCK_BASS"
      volume: 1.0
      pitch: 1.0

    # 每个 GUI 按钮都可以独立指定音效
    # name:
    # - "INHERIT" = 继承 sounds.gui.click
    # - "NONE" = 关闭该按钮音效
    # - 其他值 = Bukkit Sound 枚举名

    # 备份列表页按钮音效
    backup-list:
      # 点击某条备份记录，打开预览详情
      entry-open:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击不可翻页的上一页/下一页玻璃板
      page-disabled:
        name: "BLOCK_NOTE_BLOCK_BASS"
        volume: 1.0
        pitch: 1.0
      # 点击上一页按钮
      prev-page:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击下一页按钮
      next-page:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击时间筛选按钮
      filter-time:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击触发类型筛选按钮
      filter-trigger:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击按编号搜索按钮
      search:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击清空筛选条件按钮
      clear-filters:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击快退 5 页按钮
      jump-back:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击快进 5 页按钮
      jump-forward:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击刷新当前页按钮
      refresh:
        name: "ENTITY_EXPERIENCE_ORB_PICKUP"
        volume: 1.0
        pitch: 1.0

    # 备份预览页按钮音效
    backup-view:
      # 点击返回备份列表按钮
      back:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击切换背包/末影箱视图按钮
      toggle:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击恢复到目标玩家按钮
      restore:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击置顶与保护按钮
      lock:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击领取待投递物品按钮
      pending:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击预览中的物品槽位进行领取
      claim-slot:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0

    # 恢复确认页按钮音效
    restore-confirm:
      # 点击确认恢复按钮
      confirm:
        name: "ENTITY_PLAYER_LEVELUP"
        volume: 1.0
        pitch: 1.0
      # 点击查看恢复目标信息按钮
      info:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      # 点击取消恢复按钮
      cancel:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
