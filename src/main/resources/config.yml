# PlayerInvBackup config, for Paper / Folia 1.21.1+
# Current backup scope includes player inventory (with armor and offhand), ender chest, and experience
# After editing, run /pib reload, or restart the server to apply changes

# Language file name, available values, zh_CN.yml, en_US.yml
language: "en_US.yml"

# Server source settings
server:
  # Current server ID
  id: "default"

  # Server aliases
  aliases:
    default: "Default Server"

# Display related settings
display:
  # Backup time display format, uses Java DateTimeFormatter pattern
  backup-time-format: "yyyy-MM-dd HH:mm:ss"

  # World alias mapping, used for world names shown in GUI and messages
  world-aliases:
    world: "Overworld"
    world_nether: "Nether"
    world_the_end: "The End"

# Backup policy and trigger settings
backup:
  # Automatic backup interval in minutes, set to 0 to disable timer backups
  interval-minutes: 30

  # Self-backup cooldown in seconds for /pib backup without a target argument
  manual-self-cooldown-seconds: 5

  # Progress reminder interval for /pib backupall in seconds, set to 0 to disable
  backupall-progress-interval-seconds: 3

  # Random per-player jitter in seconds
  jitter-seconds: 300

  # Maximum backups kept per player, set to 0 to disable count-based cleanup
  keep-per-player: 0

  # Maximum backup days kept per player, set to 0 to disable age-based cleanup
  keep-days: 0

  # Automatic backup triggers
  triggers:
    join: true
    quit: true
    death: true
    world-change: true

  # Excluded worlds, backups will not be triggered by timer or events in these worlds
  excluded-worlds: []

# Audit log related settings
audit:
  # Enable audit logs, logs are written to plugins/PlayerInvBackup/logs
  enabled: true

  # Also print audit logs to console
  console: true

  # Audit log retention in days, set to 0 to disable cleanup
  keep-days: 30

# Backup location teleport command settings
teleport:
  # Enable the backup preview teleport button
  enabled: true

  # Command executed by console when clicking the teleport button
  # Available variables
  # <player> -> player who clicked the teleport button
  # <player_uuid> -> UUID of the player who clicked the teleport button
  # <target> -> backup owner name
  # <target_uuid> -> backup owner UUID
  # <server> -> source server ID saved in the backup
  # <server_display> -> source server display name after server.aliases
  # <world> -> world name saved in the backup
  # <x> -> backup X coordinate
  # <y> -> backup Y coordinate
  # <z> -> backup Z coordinate
  # <backup_id> -> current backup ID
  # Cross-server or cross-world teleport should be handled by your own command/plugin
  command: "tp <player> <x> <y> <z>"

# bStats related settings
bstats:
  # Enable bStats
  enabled: true

# Update checker settings
update-checker:
  # Check GitHub Releases asynchronously for new stable releases
  enabled: true

  # Check interval in hours
  check-interval-hours: 24

  # Notify players with playerinvbackup.admin when a new version is cached
  notify-admins: true

# Storage backend related settings
storage:
  # Storage type, available values, local, sqlite, mysql, postgresql, h2
  type: sqlite

  # Local file storage settings
  local:
    # Local storage base path, relative to plugins/PlayerInvBackup/
    base-path: "data"

  # SQLite storage settings
  sqlite:
    # SQLite database file path, relative to plugins/PlayerInvBackup/
    file: "data/backups.db"
    # Table prefix, set to an empty string to disable prefixes
    table-prefix: "pib_"

  # MySQL storage settings
  mysql:
    # Full JDBC URL, if set it takes priority
    url: ""
    host: "127.0.0.1"
    port: 3306
    database: "playerinvbackup"
    username: "root"
    password: ""
    # Extra JDBC parameters, joined with &
    parameters: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8"
    # Table prefix, set to an empty string to disable prefixes
    table-prefix: "pib_"
    # Connection pool settings
    pool:
      # Maximum pool size
      maximum-pool-size: 4
      # Minimum idle connections
      minimum-idle: 1
      # Connection acquisition timeout
      connection-timeout-ms: 5000
      # Connection validation timeout
      validation-timeout-ms: 3000
      # Idle connection retention time
      idle-timeout-ms: 300000
      # Maximum connection lifetime
      max-lifetime-ms: 1800000
      # Leak detection threshold
      leak-detection-threshold-ms: 0

  # PostgreSQL storage settings
  postgresql:
    # Full JDBC URL, if set it takes priority
    url: ""
    host: "127.0.0.1"
    port: 5432
    database: "playerinvbackup"
    username: "postgres"
    password: ""
    # Extra JDBC parameters, joined with &
    parameters: "sslmode=disable"
    # Table prefix, set to an empty string to disable prefixes
    table-prefix: "pib_"
    # Connection pool settings
    pool:
      # Maximum pool size
      maximum-pool-size: 4
      # Minimum idle connections
      minimum-idle: 1
      # Connection acquisition timeout
      connection-timeout-ms: 5000
      # Connection validation timeout
      validation-timeout-ms: 3000
      # Idle connection retention time
      idle-timeout-ms: 300000
      # Maximum connection lifetime
      max-lifetime-ms: 1800000
      # Leak detection threshold
      leak-detection-threshold-ms: 0

  # H2 storage settings
  h2:
    # Full JDBC URL, if set it takes priority
    url: ""
    # H2 file path, relative to plugins/PlayerInvBackup/, without the .mv.db suffix
    file: "data/backups_h2"
    username: "sa"
    password: ""
    # Extra JDBC parameters, joined with ;
    parameters: "MODE=MySQL;DATABASE_TO_UPPER=false"
    # Table prefix, set to an empty string to disable prefixes
    table-prefix: "pib_"

# Performance and write rate settings
performance:
  # I/O queue limit, new backup requests are rejected after this limit is reached
  queue-limit: 500

  # Maximum writes per second
  max-writes-per-second: 20

# GUI related settings
gui:
  # GUI mode
  # auto -> automatically detect ProtocolLib
  # bukkit -> use Bukkit native GUI
  # packet -> force ProtocolLib Packet GUI
  mode: "auto"

  # Delay before showing the loading indicator in GUI, in real seconds
  # Set to 0 to show the loading indicator immediately
  loading-indicator-delay-seconds: 3

  # Backups shown per page, must be <= 45
  list-page-size: 45

  # Backup preview behavior settings
  preview:
    # Whether items can only be claimed once
    claim-once: false

  # Backup preview screen related settings
  backup-view:
    incompatible-claim:
      # false, only block incompatible slots
      # true, if any incompatible item exists, block claiming from the whole backup
      block-whole-backup: false
    export:
      # Shulker box material used by backup view export
      # Supported values: SHULKER_BOX and all colored shulker boxes, for example RED_SHULKER_BOX
      shulker-box-material: "SHULKER_BOX"

  # Backup list screen related settings
  backup-list:
    # Supported time filters, for example all, 30m, 1h, 7d
    time-filters:
      - "all"
      - "30m"
      - "1h"
      - "6h"
      - "12h"
      - "24h"
      - "7d"
      - "30d"
