# PlayerInvBackup config (Paper / Folia 1.21.1+)
# Backup scope: player inventory (including armor/offhand), ender chest, and experience
# After editing, run /pib reload or restart the server.

# Available languages: zh_CN.yml, en_US.yml
language: "en_US.yml"

display:
  # Java DateTimeFormatter pattern used to display backup time.
  backup-time-format: "yyyy-MM-dd HH:mm:ss"

  # Display aliases for world names shown in GUI/messages.
  world-aliases:
    world: "Overworld"
    world_nether: "Nether"
    world_the_end: "The End"

backup:
  # Automatic backup interval in minutes. 0 disables timer backups.
  interval-minutes: 30

  # Cooldown in seconds for /pib backup with no target argument.
  manual-self-cooldown-seconds: 5

  # Progress reminder interval for /pib backupall in seconds. 0 disables reminders.
  backupall-progress-interval-seconds: 3

  # Random delay added per player to spread writes.
  jitter-seconds: 300

  # Keep the latest N backups per player. 0 disables count-based cleanup.
  keep-per-player: 0

  # Keep backups from the latest N days. 0 disables age-based cleanup.
  keep-days: 0

  triggers:
    join: true
    quit: true
    death: true
    world-change: true

  # Worlds excluded from timer/event backups.
  excluded-worlds: []

audit:
  # Write audit logs under plugins/PlayerInvBackup/logs.
  enabled: true

  # Also mirror audit entries to console.
  console: true

  # Keep audit logs for N days. 0 disables cleanup.
  keep-days: 30

bstats:
  enabled: true

storage:
  # local | sqlite | mysql | postgresql | h2
  type: sqlite

  local:
    # Relative to plugins/PlayerInvBackup/
    base-path: "data"

  sqlite:
    file: "data/backups.db"
    table-prefix: "pib_"

  mysql:
    # If url is set, it takes priority over host/port/database.
    url: ""
    host: "127.0.0.1"
    port: 3306
    database: "playerinvbackup"
    username: "root"
    password: ""
    # Extra parameters joined with &.
    parameters: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8"
    table-prefix: "pib_"

  postgresql:
    # If url is set, it takes priority over host/port/database.
    url: ""
    host: "127.0.0.1"
    port: 5432
    database: "playerinvbackup"
    username: "postgres"
    password: ""
    # Extra parameters joined with &.
    parameters: "sslmode=disable"
    table-prefix: "pib_"

  h2:
    # If url is set, it takes priority over file.
    url: ""
    # Relative to plugins/PlayerInvBackup/, without the .mv.db suffix.
    file: "data/backups_h2"
    username: "sa"
    password: ""
    # Extra parameters joined with ;.
    parameters: "MODE=MySQL;DATABASE_TO_UPPER=false"
    table-prefix: "pib_"

performance:
  # Maximum queued I/O write tasks before new backup requests are rejected.
  queue-limit: 500

  # Soft write rate limit.
  max-writes-per-second: 20

gui:
  # auto | bukkit | packet
  mode: "auto"

  # Maximum backups shown per page. Must be <= 45.
  list-page-size: 45

  backup-view:
    incompatible-claim:
      # false: only block incompatible slots, true: block claiming the whole backup view if any incompatible item exists
      block-whole-backup: false

  backup-list:
    # Supported entries: all, 30m, 1h, 6h, 12h, 24h, 7d, 30d ...
    time-filters:
      - "all"
      - "30m"
      - "1h"
      - "6h"
      - "12h"
      - "24h"
      - "7d"
      - "30d"

sounds:
  command:
    help-click:
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.0

  gui:
    enabled: true

    # Default GUI click sound.
    click:
      name: "UI_BUTTON_CLICK"
      volume: 1.0
      pitch: 1.0

    # Played when clicking a blocked/unavailable slot.
    barrier-slot:
      name: "BLOCK_NOTE_BLOCK_BASS"
      volume: 1.0
      pitch: 1.0

    # INHERIT = use sounds.gui.click
    # NONE = disable this sound
    # Otherwise use a Bukkit Sound enum name.
    backup-list:
      entry-open:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      page-disabled:
        name: "BLOCK_NOTE_BLOCK_BASS"
        volume: 1.0
        pitch: 1.0
      prev-page:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      next-page:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      filter-time:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      filter-trigger:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      search:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      clear-filters:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      jump-back:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      jump-forward:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      refresh:
        name: "ENTITY_EXPERIENCE_ORB_PICKUP"
        volume: 1.0
        pitch: 1.0

    backup-view:
      back:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      toggle:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      restore:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      lock:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      pending:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      claim-slot:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0

    restore-confirm:
      confirm:
        name: "ENTITY_PLAYER_LEVELUP"
        volume: 1.0
        pitch: 1.0
      info:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      cancel:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
