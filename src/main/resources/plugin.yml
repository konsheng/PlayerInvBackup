name: ${name}
version: ${version}
main: org.playerinvbackup.backup.PlayerInvBackupPlugin
api-version: "1.21"
folia-supported: true
softdepend: [ProtocolLib]
authors: [Konsheng]
description: Paper / Folia 背包备份, 包含玩家背包和末影箱

commands:
  playerinvbackup:
    description: PlayerInvBackup 管理命令
    usage: "用法: /playerinvbackup help"
    aliases: [pib, invb, invbackup]

permissions:
  playerinvbackup.admin:
    description: PlayerInvBackup 全部权限, 包含所有子权限
    default: op
    children:
      playerinvbackup.open: true
      playerinvbackup.backup: true
      playerinvbackup.backupall: true
      playerinvbackup.self: true
      playerinvbackup.restore: true
      playerinvbackup.pending: true
      playerinvbackup.status: true
      playerinvbackup.reload: true
      playerinvbackup.list: true
      playerinvbackup.info: true
      playerinvbackup.lock: true

  playerinvbackup.open:
    description: 允许打开并使用备份 GUI
    default: false

  playerinvbackup.backup:
    description: 允许为指定在线玩家手动备份
    default: false

  playerinvbackup.backupall:
    description: 允许立即为所有在线玩家手动备份
    default: false

  playerinvbackup.self:
    description: 允许为自己手动备份
    default: false

  playerinvbackup.restore:
    description: 允许将备份恢复到玩家, 仅支持在线恢复
    default: false

  playerinvbackup.pending:
    description: 允许将待投递物品投递到自己的背包
    default: false

  playerinvbackup.status:
    description: 允许查看插件状态
    default: false

  playerinvbackup.reload:
    description: 允许重载配置和语言文件
    default: false

  playerinvbackup.list:
    description: 允许通过命令列出备份
    default: false

  playerinvbackup.info:
    description: 允许通过命令查看备份详情
    default: false

  playerinvbackup.lock:
    description: 允许置顶, 取消置顶和设置备注
    default: false

  playerinvbackup.backup.exempt:
    description: 玩家免于自动备份, 包含定时和事件触发
    default: false
