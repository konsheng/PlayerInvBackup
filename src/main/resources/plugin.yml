name: ${name}
version: ${version}
main: org.baymc.backup.BayMcBackUpPlugin
api-version: "1.21"
folia-supported: true
softdepend: [ProtocolLib]
authors: [Konsheng]
description: Paper / Folia 背包备份 (玩家背包 + 末影箱)

commands:
  playerinvbackup:
    description: PlayerInvBackup 管理命令
    usage: "用法: /playerinvbackup help"
    permission: baymcbackup.admin
    aliases: [pib, invb, invbackup]

permissions:
  baymcbackup.admin:
    description: PlayerInvBackup 全权限 (包含所有子权限)
    default: op
    children:
      baymcbackup.open: true
      baymcbackup.now: true
      baymcbackup.nowall: true
      baymcbackup.self: true
      baymcbackup.restore: true
      baymcbackup.pending: true
      baymcbackup.status: true
      baymcbackup.reload: true
      baymcbackup.list: true
      baymcbackup.info: true
      baymcbackup.lock: true

  baymcbackup.open:
    description: 允许打开并使用备份 GUI
    default: false

  baymcbackup.now:
    description: 允许为指定玩家手动备份
    default: false

  baymcbackup.nowall:
    description: 允许为所有在线玩家手动备份
    default: false

  baymcbackup.self:
    description: 允许玩家为自己手动备份
    default: false

  baymcbackup.restore:
    description: 允许将备份恢复到玩家 (仅在线)
    default: false

  baymcbackup.pending:
    description: 允许将待投递物品投递到自己的背包
    default: false

  baymcbackup.status:
    description: 允许查看插件状态
    default: false

  baymcbackup.reload:
    description: 允许重载配置和语言文件
    default: false

  baymcbackup.list:
    description: 允许通过命令列出备份
    default: false

  baymcbackup.info:
    description: 允许通过命令查看备份详情
    default: false

  baymcbackup.lock:
    description: 允许锁定/解锁备份并设置备注
    default: false

  baymcbackup.backup.exempt:
    description: 玩家免于自动备份 (定时/事件触发)
    default: false
