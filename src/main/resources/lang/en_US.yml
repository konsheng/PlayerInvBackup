prefix: "<gradient:#FFB75E:#ED8F03>[PlayerInvBackup]</gradient> <#78909C>»</#78909C> "

help:
  header: "<prefix><gradient:#FFB75E:#ED8F03><bold>PlayerInvBackup Help</bold></gradient> <#90A4AE>(v<version>)</#90A4AE>"
  lines:
    - "<prefix><#4FC3F7>💡 Tip: </#4FC3F7><#B0BEC5>When the target is offline, online-mode servers require UUID or cached name; offline-mode servers can use the name directly</#B0BEC5>"
    - "<prefix><#4FC3F7>💡 Tip: </#4FC3F7><#B0BEC5>Click a slot in GUI to claim the whole stack; full inventory goes to pending (/<label> pending)</#B0BEC5>"
    - "<prefix><#4FC3F7>💡 Tip: </#4FC3F7><#B0BEC5>Backup ID is shown on the paper item in 'Backup List' under 'ID'; restore is recommended via GUI 'Restore to player' with confirmation</#B0BEC5>"
    - "<prefix><#4FC3F7>💡 Tip: </#4FC3F7><#B0BEC5>On Folia, restore only supports online players</#B0BEC5>"
    - "<prefix><#EF5350>⚠ Warning: </#EF5350><#FF8A65>Restore overwrites the target's inventory and ender chest (only unclaimed slots are restored)</#FF8A65>"
    - "<prefix><#78909C>Console tip: open/pending are GUI or inventory actions and only work in game</#78909C>"
  commands:
    - "<prefix><#4FC3F7>/<label> open [player/UUID]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Open your own backup list with no argument, or open the specified player's list</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> list <player/UUID> [page]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>List backups (console friendly)</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> info <player/UUID> <backup id></#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Show backup details</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> lock <player/UUID> <backup id> [note]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Pin a backup (not auto purged)</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> unlock <player/UUID> <backup id></#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Unpin a backup</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> note <player/UUID> <backup id> [note]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Set or clear backup note</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> backup [player/UUID]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Backup yourself with no argument, or backup the specified online player</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> backupall</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Immediately back up all online players</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> pending</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Deliver pending items into inventory</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> restore <player/UUID> <backup id></#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Restore the backup (claimed slots excluded)</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> status</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Show status</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> reload</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Reload config and language</#E0E0E0>"
    - "<prefix><#4FC3F7>/<label> help</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>Show this help</#E0E0E0>"
  example: "<prefix><#90A4AE>Example: </#90A4AE><#4FC3F7>/<label> open</#4FC3F7> <#78909C>or</#78909C> <#4FC3F7>/<label> open Steve</#4FC3F7>"

