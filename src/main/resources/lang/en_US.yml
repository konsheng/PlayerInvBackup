prefix: "<#FFB300>[PlayerInvBackup]</#FFB300> <#90A4AE>»</#90A4AE> "

help:
  header: "<prefix><#FFB300>PlayerInvBackup Help</#FFB300> <#90A4AE>(v<version>)</#90A4AE>"
  lines:
    - "<prefix><#B0BEC5>Permission: </#B0BEC5><white><perm></white><#B0BEC5>(default OP)</#B0BEC5>"
    - "<prefix><#B0BEC5>Config: </#B0BEC5><white><config></white>"
    - "<prefix><#B0BEC5>Backup scope: </#B0BEC5><white>Inventory (armor/offhand) + Ender Chest</white>"
    - "<prefix><#B0BEC5>Current config: </#B0BEC5><white><interval></white><#B0BEC5> min (0=off), jitter </#B0BEC5><white><jitter></white><#B0BEC5> sec, keep </#B0BEC5><white><keep></white><#B0BEC5> per player, keep days </#B0BEC5><white><keep_days></white><#B0BEC5> days</#B0BEC5>"
    - "<prefix><#B0BEC5>Storage: </#B0BEC5><white><storage_name></white><#B0BEC5>(</#B0BEC5><white><storage_path></white><#B0BEC5>)</#B0BEC5>"
    - "<prefix><#90A4AE>Tip: When the target is offline, online-mode servers require UUID or cached name; offline-mode servers can use the name directly</#90A4AE>"
    - "<prefix><#90A4AE>Tip: Click a slot in GUI to claim the whole stack; full inventory goes to pending (/<label> pending)</#90A4AE>"
    - "<prefix><#90A4AE>Tip: Backup ID is shown on the paper item in 'Backup List' under 'ID'; restore is recommended via GUI 'Restore to player' with confirmation</#90A4AE>"
    - "<prefix><#90A4AE>Tip: On Folia, restore only supports online players</#90A4AE>"
    - "<prefix><#FFA726>Warning: Restore overwrites the target's inventory and ender chest (only unclaimed slots are restored)</#FFA726>"
    - "<prefix><#90A4AE>Console usage: No leading / needed (e.g., <white><label> nowall</white>)</#90A4AE>"
    - "<prefix><#90A4AE>Console tip: open/pending are GUI or inventory actions and only work in game</#90A4AE>"
  commands:
    - "<prefix><#FFD54F>/<label> open [name|UUID]</#FFD54F> <#B0BEC5>Open backup list GUI</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> list [name|UUID] [page]</#FFD54F> <#B0BEC5>List backups (console friendly)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> info [name|UUID] [backup id]</#FFD54F> <#B0BEC5>Show backup details</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> lock [name|UUID] [backup id] [note]</#FFD54F> <#B0BEC5>Pin a backup (not auto purged)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> unlock [name|UUID] [backup id]</#FFD54F> <#B0BEC5>Unpin a backup</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> note [name|UUID] [backup id] [note]</#FFD54F> <#B0BEC5>Set or clear backup note</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> now [online name|UUID]</#FFD54F> <#B0BEC5>Create a backup now</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> backup</#FFD54F> <#B0BEC5>Create a backup for yourself</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> nowall</#FFD54F> <#B0BEC5>Backup all online players (alias backupall)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> pending</#FFD54F> <#B0BEC5>Deliver pending items into inventory</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> restore [online name|UUID] [backup id]</#FFD54F> <#B0BEC5>Restore the backup (claimed slots excluded)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> status</#FFD54F> <#B0BEC5>Show status</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> reload</#FFD54F> <#B0BEC5>Reload config and language</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> help</#FFD54F> <#B0BEC5>Show this help</#B0BEC5>"
  example: "<prefix><#90A4AE>Example: </#90A4AE><#FFD54F>/<label> open Steve</#FFD54F><#90A4AE> | </#90A4AE><#FFD54F>/<label> open [uuid]</#FFD54F>"

