    - "<prefix><#90A4AE>提示: 目标离线时, 在线模式服务器需要 UUID 或服务器缓存的离线名; 离线模式服务器可直接使用名字</#90A4AE>"
    - "<prefix><#90A4AE>提示: GUI 点击物品格子可整组领取; 背包满会进入待投递(/<label> pending)</#90A4AE>"
    - "<prefix><#90A4AE>提示: 备份编号可在'备份列表'纸片的'编号'一行查看; 恢复建议在 GUI 内点'恢复到玩家'并二次确认</#90A4AE>"
