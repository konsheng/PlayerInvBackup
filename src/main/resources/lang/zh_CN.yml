    - "<prefix><#FFA726>注意: 恢复会覆盖目标玩家当前背包/末影箱(仅恢复未领取格子)</#FFA726>"
    - "<prefix><#90A4AE>控制台执行: 无需输入前导 /(例如: <white><label> nowall</white>)</#90A4AE>"
    - "<prefix><#90A4AE>控制台提示: open/pending 为 GUI/背包操作, 仅支持游戏内执行</#90A4AE>"
  commands:
    - "<prefix><#FFD54F>/<label> open [玩家名|UUID]</#FFD54F> <#B0BEC5>打开备份列表 GUI</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> list [玩家名|UUID] [页码]</#FFD54F> <#B0BEC5>列出备份(控制台友好)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> info [玩家名|UUID] [备份编号]</#FFD54F> <#B0BEC5>查看备份详情</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> lock [玩家名|UUID] [备份编号] [备注]</#FFD54F> <#B0BEC5>置顶显示备份(不会被自动清理)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> unlock [玩家名|UUID] [备份编号]</#FFD54F> <#B0BEC5>取消置顶显示</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> note [玩家名|UUID] [备份编号] [备注]</#FFD54F> <#B0BEC5>设置/清除备份备注</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> now [在线名|UUID]</#FFD54F> <#B0BEC5>立刻备份一次</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> backup</#FFD54F> <#B0BEC5>为自己立刻备份一次</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> nowall</#FFD54F> <#B0BEC5>对所有在线玩家立刻备份一次(全服备份, 别名 backupall)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> pending</#FFD54F> <#B0BEC5>投递待领取物品到背包</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> restore [在线名|UUID] [备份编号]</#FFD54F> <#B0BEC5>直接恢复该备份(会扣除已领取格子)</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> status</#FFD54F> <#B0BEC5>查看运行状态</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> reload</#FFD54F> <#B0BEC5>重载配置/语言</#B0BEC5>"
    - "<prefix><#FFD54F>/<label> help</#FFD54F> <#B0BEC5>查看本帮助</#B0BEC5>"
  example: "<prefix><#90A4AE>示例: </#90A4AE><#FFD54F>/<label> open Steve</#FFD54F><#90A4AE> | </#90A4AE><#FFD54F>/<label> open [uuid]</#FFD54F>"

