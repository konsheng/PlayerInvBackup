    banner:
      - "<#90A4AE> __     __</#90A4AE>"
      - "<#90A4AE>|__) | |__)</#90A4AE>   <gradient:#FFB75E:#ED8F03>PlayerInvBackup</gradient> <#90A4AE>v<version></#90A4AE>"
      - "<#90A4AE>|    | |__)</#90A4AE>   <#90A4AE>运行于 </#90A4AE><#E0E0E0><server></#E0E0E0>"
      - ""
    enabled: "PlayerInvBackup 已启用 (耗时 <elapsed_ms> ms)"
    disabled: "PlayerInvBackup 已关闭"

  store:
    init-failed: "初始化存储失败: <reason>"
    unavailable-standby: "存储不可用, 插件将保持启用以便修正配置, 修正后执行 /pib reload 重试"

  dependency:
    protocollib-missing: "未检测到 ProtocolLib, GUI 将使用原生方案"
    protocollib-missing-forced: "未检测到 ProtocolLib, 已按配置强制 Packet GUI 但无法启用, 已降级为原生 GUI"

  config:
    gui-mode-invalid: "gui.mode 配置无效, 已使用自动模式: <value>"
    backup-time-format-invalid: "display.backup-time-format 配置无效: <value>, 已使用默认格式 yyyy-MM-dd HH:mm:ss"
    export-shulker-material-invalid: "<path> 配置无效: <value>, 已回退为 <fallback>"
    server-id-invalid: "server.id 配置无效, 已回退为 default: <value>"
    server-alias-key-invalid: "server.aliases 存在无效键, 已忽略: <key>"
    gui-time-filter-invalid: "GUI 时间筛选配置无效, 已忽略: path=<path>, value=<value>"
    jdbc-pool:
      min-corrected: "<path> 不能小于 <limit>, 已自动修正为 <fixed>"
      max-corrected: "<path> 不能大于 <limit>, 已自动修正为 <fixed>"
      exceeds-other-corrected: "<path> 不能大于 <other>, 已自动修正为 <fixed>"
      greater-than-other-corrected: "<path> 必须大于 <other>, 已自动修正为 <fixed>"
      less-than-other-corrected: "<path> 必须小于 <other>, 已自动修正为 <fixed>"
    defaults-resource-missing: "配置默认资源不存在: <resource>"
    autofill-added: "已自动补全配置键: file=<file>, added=<added>"
    autofill-failed: "自动补全配置键失败: file=<file>, defaults=<defaults>, reason=<reason>"

  sounds:
    defaults-resource-missing: "音效默认资源不存在: <resource>"
    autofill-added: "已自动补全音效配置键: file=<file>, added=<added>"
    autofill-failed: "自动补全音效配置键失败: file=<file>, defaults=<defaults>, reason=<reason>"
    load-failed: "加载音效配置失败, 已使用内置默认音效: file=<file>, reason=<reason>"

  gui:
    init-failed: "ProtocolLib 已启用, 但 Packet GUI 初始化失败, 已降级为原生 GUI: <reason>"
    list-load-failed: "加载备份列表失败: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 页码=<page>"
    list-load-failed-query: "加载备份列表失败: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 页码=<page>, 查询=<query>"
    backup-load-failed: "加载备份失败: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>"
    snapshot-invalid: "备份数据损坏/无法解析: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>"
    pending-load-failed: "读取待投递物品失败: 操作者=<actor>(<actor_uuid>)"
    pending-mark-delivered-failed: "标记物品已投递失败: <reason>"
    pending-incompatible: "待投递物品已跳过: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>, 槽位=<slot>, 原因=<reason>"
    lock-update-failed: "更新置顶状态失败: 目标=<target_uuid>, 备份编号=<backup_id>"
    claim-failed: "领取失败: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>, 槽位=<slot>"
    claim-incompatible: "领取已被拦截: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>, 槽位=<slot>, 模式=<mode>, 原因=<reason>"
    export-failed: "导出潜影盒失败: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>, 原因=<reason>"
    teleport-command-failed: "执行备份位置传送命令失败: 操作者=<actor>(<actor_uuid>), 目标=<target_uuid>, 备份编号=<backup_id>, 命令=<command>, 原因=<reason>"

  packet-gui:
    unsupported-size: "不支持的 GUI 大小: size=<size>, player=<player>"
    menu-type-unresolved: "无法解析菜单类型, key=<key>, player=<player>"
    open-packet-failed: "发送打开 GUI 包失败: player=<player>"
    close-packet-failed: "发送关闭 GUI 包失败: player=<player>"
    refresh-packet-failed: "发送 GUI 刷新包失败: player=<player>"

  scheduler:
    auto-disabled: "自动备份已关闭 (backup.interval-minutes=0)"

  startup:
    storage: "存储后端: <storage>"
    schedule: "自动备份间隔: <interval> 分钟, 错峰: <jitter> 秒"
    retention: "保留策略: 每玩家保留最近 <keep> 份, 保留天数: <keep_days> 天, I/O 队列上限: <queue_limit>, 最大写入/秒: <max_writes>"

  update-checker:
    update-available: "检测到 PlayerInvBackup 新版本: 当前=<current>, 最新=<latest>, 标签=<tag>, 下载=<url>"
    check-failed: "检查新版本失败: <reason>"
    invalid-current-version: "当前插件版本号无法解析, 已跳过新版本比较: <version>"
    invalid-remote-version: "GitHub Release 版本号无法解析, 已跳过新版本比较: <version>"

  backup:
    encode-failed: "编码备份快照失败: 玩家=<player>(<uuid>), 备份编号=<backup_id>, 原因=<reason>"
    write-failed: "写入备份失败: 玩家=<player>(<uuid>), 备份编号=<backup_id>, 原因=<reason>"
    purge-failed: "清理旧备份失败: 玩家=<player>(<uuid>), 当前备份编号=<backup_id>, 原因=<reason>"

  audit:
    line: "[审计] 操作=<action>, 操作者=<actor>, 目标=<target>, 备份编号=<backup_id>"
    write-failed: "写入审计日志失败: file=<file>, reason=<reason>"
    rotate-failed: "压缩审计日志失败: file=<file>, reason=<reason>"
    cleanup-failed: "清理审计日志失败: file=<file>, reason=<reason>"
    maintenance-failed: "审计日志维护失败: <reason>"

  command:
    reload-failed: "重载失败: <reason>"
    list-load-failed: "加载备份列表失败: 目标=<uuid>, 页码=<page>, 原因=<reason>"
    info-load-failed: "加载备份信息失败: 目标=<uuid>, 备份编号=<backup_id>, 原因=<reason>"
    lock-failed: "置顶显示失败: 目标=<uuid>, 备份编号=<backup_id>, 原因=<reason>"
    unlock-failed: "取消置顶显示失败: 目标=<uuid>, 备份编号=<backup_id>, 原因=<reason>"
    note-failed: "设置备注失败: 目标=<uuid>, 备份编号=<backup_id>, 原因=<reason>"

  restore:
    read-failed: "读取备份失败: 操作者=<actor>, 目标=<target>(<target_uuid>), 备份编号=<backup_id>"
    sha-mismatch: "备份校验失败 (sha256 不匹配): 操作者=<actor>, 目标=<target>(<target_uuid>), 备份编号=<backup_id>, expected=<expected>, actual=<actual>"
    snapshot-invalid: "备份数据损坏/无法解析: 操作者=<actor>, 目标=<target>(<target_uuid>), 备份编号=<backup_id>"
    incompatible-backup: "恢复已被拦截: 操作者=<actor>, 目标=<target>(<target_uuid>), 备份编号=<backup_id>, 原因=<reason>"
    ender-capacity-too-small: "恢复已被拦截: 操作者=<actor>, 目标=<target>(<target_uuid>), 备份编号=<backup_id>, 备份末影箱槽位=<snapshot_ender_slots>, 目标末影箱槽位=<target_ender_slots>"
    pre-backup-failed: "恢复已取消: 恢复前保底备份失败, 操作者=<actor>, 目标=<target>(<target_uuid>), 原始备份编号=<backup_id>, 保底备份编号=<pre_restore_backup_id>, 原因=<reason>"
    pre-backup-succeeded: "恢复前保底备份已创建成功: 操作者=<actor>, 目标=<target>(<target_uuid>), 原始备份编号=<backup_id>, 保底备份编号=<pre_restore_backup_id>"
    apply-failed: "恢复失败: 操作者=<actor>, 目标=<target>(<target_uuid>), 备份编号=<backup_id>"

  sound:
    invalid: "声音配置无效: path=<path>, name=<name>, 已禁用该音效"

  lang:
    fallback: "语言文件不存在, 将回退到默认 zh_CN.yml: <path>"
    defaults-resource-missing: "语言默认资源不存在: <resource>"
    autofill-added: "已自动补全语言键: file=<file>, added=<added>"
    autofill-failed: "自动补全语言键失败: file=<file>, defaults=<defaults>, reason=<reason>"
    missing-key: "语言文件缺少键: <key> (<file>)"
    missing-list-key: "语言文件缺少列表键: <key> (<file>)"
    autofill-write-failed: "写入语言文件失败: key=<key>, file=<file>, reason=<reason>"
    parse-failed: "解析语言文本失败: file=<file>, text=<text>"
