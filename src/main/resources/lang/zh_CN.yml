prefix: "<gradient:#FFB75E:#ED8F03>[PlayerInvBackup]</gradient> <#78909C>»</#78909C> "

help:
  header: "<gradient:#FFB75E:#ED8F03><bold>PlayerInvBackup 帮助</bold></gradient> <#90A4AE>(v<version>)</#90A4AE>"
  lines:
    - "<#78909C>-</#78909C> <#90A4AE>常用说明: 输入 </#90A4AE><#4FC3F7>/<label> tips</#4FC3F7><#90A4AE> 查看使用提示</#90A4AE>"
  commands:
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> open [玩家名]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>不填参数时打开自己的备份列表, 填写后打开指定玩家</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> view [玩家名]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>只读查看自己的备份列表, 填写后只读查看指定玩家</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> list <玩家名> [页码]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>列出备份</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> info <玩家名> <备份编号></#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>查看备份详情</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> lock <玩家名> <备份编号> [备注]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>置顶显示备份</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> unlock <玩家名> <备份编号></#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>取消置顶显示</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> note <玩家名> <备份编号> [备注]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>设置/清除备份备注</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> backup [玩家名]</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>不填参数时备份自己, 填写后备份指定在线玩家</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> backupall</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>立即备份所有在线玩家</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> pending</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>投递待领取物品到背包</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> restore <玩家名> <备份编号></#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>直接恢复该备份</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> status</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>查看运行状态</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> tips</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>查看使用提示与注意事项</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> reload</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>重载配置/语言</#E0E0E0>"
    - "<#78909C>-</#78909C> <#4FC3F7>/<label> help</#4FC3F7> <#78909C>▸</#78909C> <#E0E0E0>查看本帮助</#E0E0E0>"
  example: "<#78909C>-</#78909C> <#90A4AE>示例: </#90A4AE><#4FC3F7>/<label> open</#4FC3F7> <#78909C>或</#78909C> <#4FC3F7>/<label> view Steve</#4FC3F7>"

tips:
  header: "<gradient:#FFB75E:#ED8F03><bold>PlayerInvBackup 提示</bold></gradient> <#90A4AE>(v<version>)</#90A4AE>"
  lines:
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>命令参数默认显示为玩家名, 也支持填写 UUID; 目标离线时, 在线模式服务器需要 UUID 或服务器缓存的离线名, 离线模式服务器可直接使用名字</#B0BEC5>"
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>/<label> open 可打开自己或指定玩家的备份列表, 列表支持时间筛选 触发筛选和按备份编号搜索</#B0BEC5>"
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>备份列表和详情会显示来源服务器 世界和坐标; 如果配置了 server.aliases, 会优先显示服务器别名</#B0BEC5>"
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>GUI 点击物品格子会按当前配置领取; claim-once=false 时可重复拿, claim-once=true 时领取后会变为屏障</#B0BEC5>"
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>一次性领取模式下, 背包满会进入待投递(/<label> pending); 如果物品与当前服务端不兼容, 会被跳过并继续保留</#B0BEC5>"
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>备份编号可在列表纸片的 '编号' 一行查看; /<label> note 和 /<label> lock 可给重要备份加备注并置顶, 置顶备份不会被自动清理</#B0BEC5>"
    - "<#78909C>-</#78909C> <#4FC3F7>💡 提示: </#4FC3F7><#B0BEC5>恢复建议在 GUI 内点 '恢复到玩家' 并二次确认; 经验值可单独恢复, 背包/末影箱恢复会覆盖目标当前数据</#B0BEC5>"
    - "<#78909C>-</#78909C> <#EF5350>⚠ 注意: </#EF5350><#FF8A65>Folia 下仅支持对在线玩家进行恢复; open, view 和 pending 为 GUI/背包操作, 仅支持游戏内执行</#FF8A65>"

