# PlayerInvBackup 配置 (Paper / Folia 1.21.1+)
# 备份范围: 玩家背包 (含盔甲/副手), 末影箱, 经验值
# 修改后执行 /pib reload 或重启服务器生效

# 可选语言: zh_CN.yml, en_US.yml
language: "zh_CN.yml"

display:
  # 备份时间显示格式 (Java DateTimeFormatter pattern)
  backup-time-format: "yyyy-MM-dd HH:mm:ss"

  # GUI/消息中的世界显示别名
  world-aliases:
    world: "主世界"
    world_nether: "地狱"
    world_the_end: "末地"

backup:
  # 自动备份间隔(分钟)，0 表示关闭定时备份
  interval-minutes: 30

  # /pib backup 无目标参数时的自助备份冷却(秒)
  manual-self-cooldown-seconds: 5

  # /pib backupall 进度提醒间隔(秒)，0 表示关闭
  backupall-progress-interval-seconds: 3

  # 每个玩家附加的随机错峰延迟(秒)
  jitter-seconds: 300

  # 每玩家保留最近 N 份备份，0 表示不按份数清理
  keep-per-player: 0

  # 每玩家保留最近 N 天备份，0 表示不按天数清理
  keep-days: 0

  triggers:
    join: true
    quit: true
    death: true
    world-change: true

  # 定时/事件备份排除世界
  excluded-worlds: []

audit:
  # 写入审计日志到 plugins/PlayerInvBackup/logs
  enabled: true

  # 是否同步输出到控制台
  console: true

  # 审计日志保留天数，0 表示不清理
  keep-days: 30

bstats:
  enabled: true

storage:
  # local | sqlite | mysql | postgresql | h2
  type: sqlite

  local:
    # 相对 plugins/PlayerInvBackup/
    base-path: "data"

  sqlite:
    file: "data/backups.db"
    table-prefix: "pib_"

  mysql:
    # 如果填写 url，则优先使用 url
    url: ""
    host: "127.0.0.1"
    port: 3306
    database: "playerinvbackup"
    username: "root"
    password: ""
    # 额外参数使用 & 连接
    parameters: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8"
    table-prefix: "pib_"

  postgresql:
    # 如果填写 url，则优先使用 url
    url: ""
    host: "127.0.0.1"
    port: 5432
    database: "playerinvbackup"
    username: "postgres"
    password: ""
    # 额外参数使用 & 连接
    parameters: "sslmode=disable"
    table-prefix: "pib_"

  h2:
    # 如果填写 url，则优先使用 url
    url: ""
    # 相对 plugins/PlayerInvBackup/，不要写 .mv.db 后缀
    file: "data/backups_h2"
    username: "sa"
    password: ""
    # 额外参数使用 ; 连接
    parameters: "MODE=MySQL;DATABASE_TO_UPPER=false"
    table-prefix: "pib_"

performance:
  # 最大 I/O 写入队列长度，超过后新备份请求会被拒绝
  queue-limit: 500

  # 软写入速率限制
  max-writes-per-second: 20

gui:
  # auto | bukkit | packet
  mode: "auto"

  # 每页显示备份数量，必须 <= 45
  list-page-size: 45

  backup-view:
    incompatible-claim:
      # false: 仅屏蔽不兼容槽位, true: 只要存在不兼容物品就禁止整份备份的槽位领取
      block-whole-backup: false

  backup-list:
    # 支持: all, 30m, 1h, 6h, 12h, 24h, 7d, 30d ...
    time-filters:
      - "all"
      - "30m"
      - "1h"
      - "6h"
      - "12h"
      - "24h"
      - "7d"
      - "30d"

sounds:
  command:
    help-click:
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.0

  gui:
    enabled: true

    # 默认 GUI 点击音效
    click:
      name: "UI_BUTTON_CLICK"
      volume: 1.0
      pitch: 1.0

    # 点击不可操作槽位时的音效
    barrier-slot:
      name: "BLOCK_NOTE_BLOCK_BASS"
      volume: 1.0
      pitch: 1.0

    # INHERIT = 继承 sounds.gui.click
    # NONE = 关闭该音效
    # 其他值 = Bukkit Sound 枚举名
    backup-list:
      entry-open:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      page-disabled:
        name: "BLOCK_NOTE_BLOCK_BASS"
        volume: 1.0
        pitch: 1.0
      prev-page:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      next-page:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      filter-time:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      filter-trigger:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      search:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      clear-filters:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      jump-back:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      jump-forward:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      refresh:
        name: "ENTITY_EXPERIENCE_ORB_PICKUP"
        volume: 1.0
        pitch: 1.0

    backup-view:
      back:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      toggle:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      restore:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      lock:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      pending:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      claim-slot:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0

    restore-confirm:
      confirm:
        name: "ENTITY_PLAYER_LEVELUP"
        volume: 1.0
        pitch: 1.0
      info:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
      cancel:
        name: "INHERIT"
        volume: 1.0
        pitch: 1.0
