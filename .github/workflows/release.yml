name: 构建并发布

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 1.0，也支持 v1.0）。留空则使用当前引用（ref）。"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: 构建并上传产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 构建
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: 创建发布（如不存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes

      - name: 上传插件 JAR 包到发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" build/libs/*.jar --clobber
